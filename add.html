*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Baloo",system-ui,sans-serif;font-weight:700;color:#4a2a12;min-height:100vh;overflow-x:hidden;
 background:linear-gradient(#7fcdfb 0%,#b5e4ff 45%,#e3f6ff 70%);display:flex;flex-direction:column;align-items:center;justify-content:center}
/* the farm around the card: sun, drifting clouds, two green hills with a fence and flowers */
.sun{position:fixed;top:-40px;right:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(#fff6b0 0 40%,#ffd65a 41% 62%,rgba(255,214,90,0) 63%)}
.cloud{position:fixed;height:46px;background:#fff;border-radius:40px;box-shadow:0 6px 0 rgba(80,140,200,.18);animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:58px;height:58px;left:18px;top:-28px}.cloud:after{width:44px;height:44px;left:58px;top:-18px}
.c1{width:130px;left:6%;top:9%;animation-duration:70s;animation-delay:-20s}.c2{width:100px;left:62%;top:22%;animation-duration:95s;animation-delay:-60s;transform:scale(.8)}.c3{width:150px;left:30%;top:4%;animation-duration:120s;animation-delay:-5s;opacity:.9}
@keyframes drift{from{left:-180px}to{left:110%}}
.hills{position:fixed;left:0;right:0;bottom:0;height:34vh;min-height:170px;z-index:0}
.hills svg{width:100%;height:100%;display:block}
main{position:relative;z-index:1;width:min(440px,92vw);margin:28px 0 70px;text-align:center}
.logo{width:min(310px,74vw);display:block;margin:0 auto -26px;position:relative;z-index:2;filter:drop-shadow(0 6px 0 rgba(74,42,18,.25));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
/* the game's window: cream paper, a dark outline, a gold rim lighter on top, a soft shadow below */
.sheet{background:#fff4dc;border-radius:30px;padding:46px 20px 22px;position:relative;
 box-shadow:inset 0 0 0 5px #e9a91c,inset 0 5px 0 5px #ffd65a,0 0 0 6px #4a2a12,0 14px 0 6px rgba(74,42,18,.28)}
.paper{background:#f6e2b8;border-radius:22px;padding:18px 14px 16px}
.who{font-size:1.4rem;line-height:1.35;margin:0 0 16px}
.code{display:inline-block;background:#fff;border:4px solid #4a2a12;border-radius:16px;padding:2px 14px;margin:2px 2px 6px;font-size:1.45rem;box-shadow:0 5px 0 rgba(74,42,18,.2)}
/* the game's chunky buttons: glossy top half, gold rim, dark outline, white letters with a dark edge */
a.btn{position:relative;display:block;margin:20px 6px;padding:14px 16px 16px;border-radius:28px;text-decoration:none;color:#fff;font-size:clamp(1.05rem,5vw,1.5rem);line-height:1.15;
 border:4px solid #f2b62a;box-shadow:0 0 0 5px #4a2a12,0 11px 0 5px rgba(74,42,18,.32);transition:transform .08s,box-shadow .08s;
 text-shadow:-2px -2px 0 #4a2a12,2px -2px 0 #4a2a12,-2px 2px 0 #4a2a12,2px 2px 0 #4a2a12,0 -2px 0 #4a2a12,0 2px 0 #4a2a12,-2px 0 0 #4a2a12,2px 0 0 #4a2a12,0 5px 0 #4a2a12}
a.btn:before{content:"";position:absolute;left:18px;top:7px;width:44px;height:13px;border-radius:10px;background:rgba(255,255,255,.75)}
a.btn:active{transform:translateY(6px);box-shadow:0 0 0 5px #4a2a12,0 5px 0 5px rgba(74,42,18,.32)}
.green{background:linear-gradient(#8bea78 0 50%,#4ccd3c 50%)}
.blue{background:linear-gradient(#7cc4ff 0 50%,#2f9dff 50%)}
.note{font-size:.98rem;line-height:1.45;color:#8a6a4a;margin:6px 4px 0;font-weight:600}
@media (prefers-reduced-motion:reduce){.cloud,.logo{animation:none}}
</style></head>
